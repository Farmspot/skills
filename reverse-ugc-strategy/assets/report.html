<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UGC strategy report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --night: #0b0726; --panel: #15113a; --panel-2: #1d1850; --line: #2b2566; --grid: #231e57;
  --text: #f4f3ff; --muted: #a29fc9; --faint: #6f6a9e;
  --indigo: #4f39f6; --lavender: #a79bff; --lime: #eeff41; --pink: #ff005b; --peer: #57518f;
  --up: #7ee2a8; --down: #ff6b8f; --seen: #7ee2a8; --inferred: #ffc857;
  --radius: 20px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--night); color: var(--text); font-family: Inter, system-ui, sans-serif; font-feature-settings: "tnum"; }
body { line-height: 1.5; }
a { color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 48px 16px 96px; }
.label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
h1 { font-size: clamp(32px, 5vw, 52px); letter-spacing: -.05em; line-height: 1.02; margin: 10px 0 14px; font-weight: 600; }
h2 { font-size: clamp(22px, 3vw, 30px); letter-spacing: -.035em; margin: 6px 0 6px; font-weight: 600; line-height: 1.15; }
h3 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -.01em; line-height: 1.35; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
section { margin-top: 64px; }
.section-head { margin-bottom: 18px; max-width: 820px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.grid { display: grid; gap: 12px; }
.g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.brandline { display: flex; align-items: center; gap: 12px; }
.brandline img { width: 44px; height: 44px; border-radius: 12px; background: var(--panel-2); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--panel-2); font-size: 12px; color: var(--muted); }
.pill.lime { background: var(--lime); color: var(--night); font-weight: 600; }
.verdict { font-size: clamp(19px, 2.4vw, 24px); letter-spacing: -.02em; line-height: 1.35; max-width: 860px; }
.verdict b, .insight b { background: var(--lime); color: var(--night); padding: 0 5px; border-radius: 5px; font-weight: 600; }
.banner { margin: 28px 0 0; border-radius: var(--radius); padding: 20px 22px; background: linear-gradient(120deg, var(--indigo), #2a1a9c); color: #fff; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
.banner h3 { font-size: 19px; margin: 0 0 4px; }
.btn { display: inline-flex; align-items: center; padding: 9px 16px; border-radius: 999px; background: var(--lime); color: var(--night); text-decoration: none; border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: 14px; }
.btn.ghost { background: var(--panel-2); color: var(--text); }
.blocks { display: grid; gap: 12px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.blocks > * { grid-column: span 12; min-width: 0; }
.blocks > .half { grid-column: span 6; }
.blocks > .third { grid-column: span 4; }
@media (max-width: 820px) { .blocks > .half, .blocks > .third { grid-column: span 12; } }
.bhead { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.src { font-size: 11px; color: var(--faint); margin-top: 10px; }
.insight { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
.empty { color: var(--faint); font-size: 14px; padding: 12px 0; }

/* tiles */
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile .label { overflow-wrap: anywhere; }
.tile .vrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tile .v { font-size: 28px; font-weight: 600; letter-spacing: -.04em; line-height: 1.1; }
.tile .s { font-size: 12px; color: var(--muted); }
.delta { font-size: 12px; font-weight: 600; }
.delta.up { color: var(--up); } .delta.down { color: var(--down); } .delta.flat { color: var(--muted); }
.rank { font-size: 11px; font-weight: 600; color: var(--night); background: var(--lavender); border-radius: 6px; padding: 1px 6px; }

/* stacked panels */
.chart { width: 100%; overflow-x: auto; }
.stack { position: relative; min-width: 640px; }
.stack svg { display: block; width: 100%; height: auto; overflow: visible; }
.stack .xh { position: absolute; top: 0; bottom: 18px; width: 0; border-left: 1px solid var(--text); opacity: 0; pointer-events: none; }
.readout { font-size: 12px; color: var(--muted); min-height: 18px; margin: 8px 0 4px; }
.readout b { color: var(--text); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.hatch { background: repeating-linear-gradient(135deg, var(--lavender) 0 2px, transparent 2px 5px); border: 1px solid var(--lavender); }
.legend i.nt { background: repeating-linear-gradient(135deg, var(--grid) 0 3px, transparent 3px 6px); border: 1px solid var(--line); }

/* rows, tables */
.rows { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: minmax(120px, 1.2fr) 2fr auto; gap: 12px; align-items: center; font-size: 14px; }
.bar { height: 10px; border-radius: 6px; background: var(--panel-2); overflow: hidden; position: relative; }
.bar > i { display: block; height: 100%; border-radius: 6px; background: var(--lavender); }
.bar.win > i { background: var(--lime); }
.bar.self > i { background: var(--pink); }
.num { color: var(--muted); font-size: 13px; text-align: right; white-space: nowrap; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--faint); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr.thin td { color: var(--faint); }
.tablewrap { overflow-x: auto; }
.cellbar { display: grid; grid-template-columns: 1fr 52px; gap: 8px; align-items: center; min-width: 140px; }
.cellbar .bar { height: 8px; }
.cellbar .ref { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .7; }
.heat td { text-align: center; font-size: 12px; padding: 5px 3px; border: 0; }
.heat td.rowname { text-align: left; white-space: nowrap; color: var(--muted); padding-right: 12px; }
.heat { width: 100%; table-layout: fixed; }
.heat th { text-align: center; padding: 4px 2px; border: 0; font-size: 10px; white-space: normal; line-height: 1.25; vertical-align: bottom; }
.heat th:first-child { width: 120px; }
.heat .n { display: block; opacity: .6; font-weight: 400; font-size: 10px; }
.heat .cell { border-radius: 6px; padding: 5px 2px; color: var(--text); white-space: nowrap; font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.share { display: flex; height: 22px; border-radius: 6px; overflow: hidden; margin: 12px 0 10px; gap: 2px; }
.share > i { display: block; height: 100%; }

/* videos */
.covers { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 10px; }
.cover { position: relative; aspect-ratio: 9/16; border-radius: 14px; overflow: hidden; background: var(--panel-2); display: block; text-decoration: none; }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover .ov { position: absolute; left: 6px; right: 6px; bottom: 6px; display: flex; justify-content: space-between; gap: 4px; font-size: 11px; font-weight: 600; }
.cover .ov span { background: rgba(11,7,38,.8); color: #fff; padding: 2px 6px; border-radius: 6px; }
.cover .ov .r { background: var(--pink); }
.cover .fmt { position: absolute; left: 6px; top: 6px; font-size: 10px; background: rgba(11,7,38,.8); color: #fff; padding: 2px 6px; border-radius: 6px; }
.cover .who { position: absolute; left: 6px; right: 6px; top: 26px; font-size: 10px; color: #fff; text-shadow: 0 1px 2px #000; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.seg { display: flex; height: 30px; border-radius: 8px; overflow: hidden; margin: 12px 0 6px; gap: 2px; }
.seg > div { display: flex; align-items: center; padding: 0 8px; font-size: 11px; font-weight: 600; color: var(--night); white-space: nowrap; overflow: hidden; }
.ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); }
.beats { display: grid; gap: 6px; margin-top: 10px; }
.beat { display: grid; grid-template-columns: 64px 1fr; gap: 10px; font-size: 13px; }
.beat .t { color: var(--faint); }
.beat b { display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--lavender); }
.formula { font-size: 14px; line-height: 1.45; }
.formula em { font-style: normal; color: var(--lime); }
.big { font-size: 44px; font-weight: 600; letter-spacing: -.04em; line-height: 1; }
.notes li { margin: 0 0 8px; font-size: 14px; }
.action .meta { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 10px 0; line-height: 1.7; }
.action summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.action pre { white-space: pre-wrap; background: var(--panel-2); padding: 12px; border-radius: 12px; font: 13px/1.5 Inter, system-ui, sans-serif; margin: 8px 0; }
.lockcard { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; border-style: dashed; background: transparent; }
.method { font-size: 13px; color: var(--muted); }
.foot { margin-top: 64px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--faint); }
@media (max-width: 640px) { .row { grid-template-columns: 1fr auto; } .row .bar { grid-column: 1 / -1; } }
@media print { .btn { display: none; } }
.tip { position: fixed; z-index: 50; pointer-events: none; max-width: 320px; background: #05031a; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: 12px; line-height: 1.4; box-shadow: 0 8px 24px rgba(0,0,0,.45); opacity: 0; transition: opacity .08s; }
.tip.on { opacity: 1; }
[data-tip] { cursor: default; }
a[data-tip], a [data-tip] { cursor: pointer; }
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<!-- The skill puts the report JSON here (references/report-data.md); scripts/render.mjs escapes every less-than sign. -->
<script type="application/json" id="report-data">__REPORT_DATA__</script>

<script>
(() => {
  const D = JSON.parse(document.getElementById('report-data').textContent)
  const app = document.getElementById('app')
  const M = D.meta || {}
  const upgrade = M.upgrade_url || 'https://www.farmspot.ai/billing'
  let uid = 0

  // Every string from the data goes in as text, never as HTML: captions and hooks are written by strangers.
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag)
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue
      if (k === 'class') el.className = v
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
      else el.setAttribute(k, v === true ? '' : v)
    }
    for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k))
    return el
  }
  const svg = (tag, attrs, ...kids) => {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag)
    for (const [k, v] of Object.entries(attrs || {})) if (v != null) el.setAttribute(k, v)
    for (const k of kids.flat()) if (k != null) el.append(k instanceof Node ? k : document.createTextNode(String(k)))
    return el
  }
  const fmt = (n) => n == null || isNaN(n) ? '–' : Math.abs(n) >= 1e9 ? +(n / 1e9).toFixed(1) + 'B' : Math.abs(n) >= 1e6 ? +(n / 1e6).toFixed(1) + 'M' : Math.abs(n) >= 1e4 ? Math.round(n / 1e3) + 'K' : Math.abs(n) >= 1e3 ? +(n / 1e3).toFixed(1) + 'K' : String(Math.round(n * 10) / 10)
  const pct = (x) => x == null || isNaN(x) ? '–' : Math.round(x * 100) + '%'
  const day = (s) => s ? new Date(String(s).slice(0, 10) + 'T00:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }) : ''
  const month = (s) => new Date(String(s).slice(0, 10) + 'T00:00:00Z').toLocaleDateString('en-US', { month: 'short', timeZone: 'UTC' })
  const link = (href, text) => href ? h('a', { href, target: '_blank', rel: 'noopener' }, text) : text
  const human = (s) => String(s ?? '').replace(/_/g, ' ')
  const iso = (d) => d.toISOString().slice(0, 10)
  const mondayOf = (s) => { const d = new Date(String(s).slice(0, 10) + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7)); return iso(d) }
  const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return iso(d) }
  const PALETTE = ['var(--lavender)', 'var(--lime)', 'var(--pink)', 'var(--seen)', 'var(--inferred)', '#5ec8ff']
  const TONE = { lime: 'var(--lime)', lavender: 'var(--lavender)', pink: 'var(--pink)', peer: 'var(--peer)', grey: 'var(--peer)' }
  // **words** become the one lime highlight.
  const rich = (text) => String(text ?? '').split(/\*\*(.+?)\*\*/g).map((p, i) => (i % 2 ? h('b', {}, p) : p))
  const insight = (b) => b.insight ? h('p', { class: 'insight' }, rich(b.insight)) : null
  const head = (b, right) => (b.title || right) ? h('div', { class: 'bhead' }, h('h3', {}, b.title || ''), right || null) : null
  const source = (b) => b.source ? h('div', { class: 'src' }, 'Source: ' + b.source) : null
  const card = (b, ...kids) => h('div', { class: 'card' }, head(b), insight(b), ...kids, source(b))
  // A round 1/2/2.5/5 × 10^k ceiling, so axis ticks read cleanly.
  const nice = (v) => { if (!(v > 0)) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (v <= m * e) return m * e; return 10 * e }
  const deltaEl = (d, label) => d == null || !isFinite(d) ? null : h('span', { class: 'delta ' + (d > 0.02 ? 'up' : d < -0.02 ? 'down' : 'flat') }, (d > 0.02 ? '▲ ' : d < -0.02 ? '▼ ' : '■ ') + (d > 0 ? '+' : '') + Math.round(d * 100) + '%', label ? h('span', { style: 'font-weight:400;color:var(--muted)' }, ' ' + label) : null)

  function cover(v) {
    const img = h('img', { src: v.cover, alt: v.hook || 'video cover', loading: 'lazy', onerror: (e) => e.target.remove() })
    return h('a', { class: 'cover', href: v.page, target: '_blank', rel: 'noopener', title: [v.brand, v.handle && '@' + v.handle, v.hook].filter(Boolean).join(' · ') },
      img, v.format ? h('span', { class: 'fmt' }, human(v.format)) : null, v.brand || v.handle ? h('span', { class: 'who' }, v.brand || '@' + v.handle) : null,
      h('span', { class: 'ov' }, h('span', {}, fmt(v.views)), v.ratio ? h('span', { class: 'r' }, '×' + fmt(v.ratio)) : null))
  }

  // A 12-point line for a tile.
  function spark(vals, tone) {
    const pts = (vals || []).map((v, i) => [i, v]).filter((p) => p[1] != null)
    if (pts.length < 2) return null
    const W = 84, H = 26, mx = Math.max(...pts.map((p) => p[1]), 1e-9), n = vals.length - 1
    const xy = pts.map(([i, v]) => [(i / n) * (W - 4) + 2, H - 3 - (v / mx) * (H - 6)])
    const last = xy[xy.length - 1]
    return svg('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, 'aria-hidden': 'true' },
      svg('polyline', { points: xy.map((p) => p.join(',')).join(' '), fill: 'none', stroke: TONE[tone] || 'var(--lavender)', 'stroke-width': 1.5, 'stroke-linejoin': 'round' }),
      svg('circle', { cx: last[0], cy: last[1], r: 2.5, fill: TONE[tone] || 'var(--lavender)' }))
  }

  // ---- the weekly panels: one measure per panel, one under the other, on one week axis ------------------------
  // Raw dated rows in; the page bins them by Monday (UTC). agg: sum | count | last | max | diff (weekly gain of a
  // running count). kind: bars | line | step (a monthly figure held across its weeks) | dots (one dot per row).
  function panels(b) {
    const to = String(b.to || M.generated_at || '').slice(0, 10) || iso(new Date())
    const P = (b.panels || []).filter((p) => (p.points || []).length || (p.rows || []).length || p.kind === 'dots')
    const allDates = P.flatMap((p) => (p.points || []).map((x) => x.date)).filter(Boolean).sort()
    const from = mondayOf(b.from || allDates[0] || to)
    const weeks = []
    for (let w = from; w <= mondayOf(to); w = addDays(w, 7)) weeks.push(w)
    const at = new Map(weeks.map((w, i) => [w, i]))
    const nW = weeks.length
    // the current week is still counting: hatched, left out of the change figures
    const partial = addDays(weeks[nW - 1], 6) > to ? nW - 1 : -1
    const lastFull = partial >= 0 ? nW - 2 : nW - 1

    const series = P.map((p) => {
      if (p.kind === 'spans') p = { ...p, agg: 'sum', points: (p.rows || []).flatMap((r) => r.points || []) }
      const pts = (p.points || []).filter((x) => x.date && (x.value != null || p.kind === 'dots')).sort((a, c) => (a.date < c.date ? -1 : 1))
      const per = new Array(nW).fill(null), items = Array.from({ length: nW }, () => [])
      const agg = p.agg || (p.kind === 'line' || p.kind === 'step' ? 'last' : 'sum')
      if (p.kind === 'step') {
        weeks.forEach((w, i) => { let v = null; for (const x of pts) if (x.date <= addDays(w, 6)) v = x.value; per[i] = v })
      } else if (agg === 'diff') {
        const last = new Map(); for (const x of pts) last.set(mondayOf(x.date), x.value)
        let prev = null; weeks.forEach((w, i) => { const e = last.get(w); if (e != null && prev != null) per[i] = Math.max(e - prev, 0); if (e != null) prev = e })
      } else {
        for (const x of pts) {
          const i = at.get(mondayOf(x.date)); if (i == null) continue
          items[i].push(x)
          if (agg === 'count' || p.kind === 'dots') per[i] = (per[i] || 0) + 1
          else if (agg === 'sum') per[i] = (per[i] || 0) + x.value
          else if (agg === 'max') per[i] = Math.max(per[i] ?? -Infinity, x.value)
          else per[i] = x.value
        }
      }
      // tracked_from: weeks before it are "not tracked" (grey), never zero
      const tf = p.tracked_from ? mondayOf(p.tracked_from) : (agg === 'sum' || agg === 'count' || p.kind === 'dots') ? from : pts.length ? mondayOf(pts[0].date) : from
      const tIdx = at.has(tf) ? at.get(tf) : tf < from ? 0 : nW
      if (agg === 'sum' || agg === 'count' || p.kind === 'dots') for (let i = tIdx; i < nW; i++) if (per[i] == null) per[i] = 0
      for (let i = 0; i < Math.min(tIdx, nW); i++) per[i] = null
      return { ...p, per, items, tIdx, agg, tone: TONE[p.tone] || TONE[p.highlight ? 'lime' : b.shared_scale ? 'peer' : 'lavender'] }
    })
    if (!series.length) return h('div', { class: 'card empty' }, 'No dated data.')

    const W = 1000, L = 64, R = 132, PH0 = b.panel_height || 70, TOP = 20, GAP = 14, bw = (W - L - R) / nW
    const xc = (i) => L + (i + 0.5) * bw
    // one spike flattens every other week: past 2.5x the third-highest week, bars are clipped and labelled
    const capOf = (vs) => { const d = vs.filter((v) => v != null && v > 0).sort((a, b) => b - a); if (!d.length) return 1; const ref = d[Math.min(2, d.length - 1)]; return d[0] > 2.5 * ref ? ref * 1.3 : d[0] }
    const sharedMax = b.shared_scale ? nice(capOf(series.flatMap((s) => s.per))) : null
    const id = 'b' + ++uid
    const stack = h('div', { class: 'stack' })
    const readouts = []

    // marker labels on their own row: each takes the first line where it doesn't touch an earlier label
    const markers = (b.markers || []).map((m) => ({ ...m, i: at.get(mondayOf(m.date)) })).filter((m) => m.i != null)
    if (markers.length) {
      const LH = 14, ends = [], placed = []
      for (const m of [...markers].sort((a, b) => a.i - b.i)) {
        const x = xc(m.i), w = String(m.label).length * 6.1 + 8, right = x > W - R - 120
        const x0 = right ? x - w : x, x1 = right ? x : x + w
        let line = ends.findIndex((e) => e < x0)
        if (line < 0) { line = ends.length; ends.push(-1) }
        ends[line] = x1
        placed.push({ m, x, line, right })
      }
      const MH = ends.length * LH + 6
      const ms = svg('svg', { viewBox: `0 0 ${W} ${MH}`, role: 'presentation' })
      for (const { m, x, line, right } of placed) {
        const y = 11 + line * LH
        ms.append(svg('text', { x: right ? x - 4 : Math.min(x + 4, W - R - 4), y, 'font-size': 11, fill: 'var(--lime)', 'text-anchor': right ? 'end' : 'start' }, m.label))
        ms.append(svg('line', { x1: x, x2: x, y1: y + 3, y2: MH, stroke: 'var(--lime)', 'stroke-dasharray': '2 3', opacity: 0.7 }))
      }
      stack.append(ms)
    }

    series.forEach((s, si) => {

      const label = (c) => c.label ?? (b.scale === 'rate' ? pct(c.value) : fmt(c.value))

        h('div', {}, head(b), insight(b), h('div', { class: 'seg' }, (b.beats || []).map((x) => h('div', { style: `width:${((x.end - x.start) / dur) * 100}%;background:${color(x.label)}`, title: x.text || '' }, x.label))),

      h('div', { class: 'formula' }, String(f.template || '').split(/(\[[^\]]+\])/g).map((p) => (/^\[.+\]$/.test(p) ? h('em', {}, p) : p))),
      h('div', { class: 'num' }, h('b', { style: 'color:var(--text)' }, `${f.hits}/${f.videos}`), ' hits', f.median ? ` · median ${fmt(f.median)}` : '', f.top_video ? [' · ', link(f.top_video, 'top')] : null)))),

    actions: (b) => h('div', { class: 'grid g3' }, (b.items || []).map((a, i) => h('div', { class: 'card action' }, h('div', { class: 'label' }, 'Do this · ' + (i + 1)), h('h3', { style: 'margin-top:6px;font-size:16px' }, a.title), a.why ? h('p', { class: 'muted', style: 'font-size:14px;margin-top:6px' }, rich(a.why), a.evidence ? [' ', link(a.evidence, '→ video')] : null) : null,
      h('div', { class: 'meta' }, ['Start ' + (a.start || '–'), 'Effort ' + (a.effort || '–'), 'Watch ' + (a.watch || '–')].join(' · ')),

    notes: (b) => card(b, h('ul', { class: 'notes', style: 'margin:10px 0 0;padding-left:18px' }, (b.items || []).map((n) => h('li', {}, n.date ? h('span', { class: 'label', style: 'margin-right:8px' }, day(n.date)) : null, rich(n.text), n.link ? [' ', link(n.link, '→')] : null)))),

    big: (b) => h('div', { class: 'card' }, h('div', { class: 'label' }, b.label), h('div', { class: 'big', style: 'margin:10px 0 6px' }, b.value), b.sub ? h('div', { class: 'muted', style: 'font-size:13px' }, b.sub) : null, insight(b)),
  }

  function block(b) {
    const make = BLOCKS[b.type]
    let el
    try { el = make ? make(b) : h('div', { class: 'card empty' }, 'Unknown block: ' + b.type) } catch (e) { el = h('div', { class: 'card empty' }, `Block "${b.title || b.type}" could not be drawn: ${e.message}`) }
    if (b.width === 'half' || b.width === 'third') el.classList.add(b.width)
    return el
  }

  // ---- the fixed shell --------------------------------------------------------------------------------------
  app.append(h('header', {},
    h('div', { class: 'brandline' }, M.icon ? h('img', { src: M.icon, alt: '', onerror: (e) => e.target.remove() }) : null,
      h('div', {}, h('div', { class: 'label' }, M.kicker || 'Reverse-engineered UGC strategy'), h('div', { class: 'muted' }, [M.category, M.niche].filter(Boolean).join(' › ')))),
    h('h1', {}, link(M.brand_page, M.brand || 'Brand'), M.title_suffix || ': how the farm works'),
    h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' }, (M.platforms || ['TikTok']).map((p) => h('span', { class: 'pill' }, p)),
      M.range ? h('span', { class: 'pill' }, day(M.range.from) + ' → ' + day(M.range.to)) : null, h('span', { class: 'pill' }, 'Generated ' + day(M.generated_at)),
      (M.sources || []).map((s) => h('span', { class: 'pill' }, s)), h('span', { class: M.mode === 'full' ? 'pill lime' : 'pill' }, M.mode === 'full' ? 'Full data' : 'Partial data'))))

  if (M.mode !== 'full') app.append(h('div', { class: 'banner' }, h('div', {}, h('h3', {}, 'Partial data'), h('div', {}, M.partial_note || 'Free calls read 25 rows a search. Growth reads every video and account.')), h('a', { class: 'btn', href: upgrade, target: '_blank', rel: 'noopener' }, 'Full report on Growth')))

  app.append(h('section', { style: 'margin-top:36px' }, V.text ? h('p', { class: 'verdict' }, rich(V.text)) : null, (V.tiles || []).length ? h('div', { style: 'margin-top:20px' }, BLOCKS.tiles({ items: V.tiles })) : null))

  ;(D.sections || []).forEach((sec, i) => {

      h('div', { class: 'blocks' }, (sec.blocks || []).map(block)))
    if (sec.locked) el.append(h('div', { class: 'card lockcard' }, h('div', {}, h('div', { class: 'label' }, 'Not in this report'), h('p', { style: 'margin:4px 0 0' }, sec.locked)), h('a', { class: 'btn', href: upgrade, target: '_blank', rel: 'noopener' }, 'Unlock on Growth')))
    app.append(el)
  })

  if (D.next) app.append(h('section', { style: 'margin-top:40px' }, h('div', { class: 'card', style: 'display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap' }, h('div', {}, h('div', { class: 'label' }, 'Next'), h('div', {}, D.next.text)), h('span', { class: 'pill lime' }, D.next.command))))

  app.append(h('section', {}, h('h2', {}, 'Method'), h('div', { class: 'method' },
    ((D.method && D.method.lines) || []).map((l) => h('p', {}, l)))))
  const tip = h('div', { class: 'tip', role: 'tooltip' })
  document.body.append(tip)
  app.querySelectorAll('svg title').forEach((t) => { t.parentNode.setAttribute('data-tip', t.textContent); t.parentNode.setAttribute('aria-label', t.textContent); t.remove() })
  app.querySelectorAll('[title]').forEach((el) => { el.setAttribute('data-tip', el.getAttribute('title')); el.removeAttribute('title') })
  document.addEventListener('pointermove', (e) => {
    const t = e.target instanceof Element ? e.target.closest('[data-tip]') : null
    if (!t || !t.getAttribute('data-tip')) return tip.classList.remove('on')
    tip.textContent = t.getAttribute('data-tip')
    const w = tip.offsetWidth, hh = tip.offsetHeight
    tip.style.left = Math.min(e.clientX + 14, innerWidth - w - 8) + 'px'
    tip.style.top = (e.clientY + 18 + hh > innerHeight ? e.clientY - hh - 10 : e.clientY + 18) + 'px'

  app.append(h('div', { class: 'foot' }, h('span', {}, 'Made with ', link('https://github.com/Farmspot/skills', '/reverse-ugc-strategy'), ' on ', link('https://www.farmspot.ai', 'Farmspot'), ' data'), h('span', {}, M.calls_used != null ? M.calls_used + ' Farmspot calls' : '')))
